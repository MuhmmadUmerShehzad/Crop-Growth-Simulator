version: '3.8'

services:
  rice-yield-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: rice-yield-growth-simulator:latest
    container_name: rice_yield_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
